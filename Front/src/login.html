<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Biblioteca Online</title>
    <link rel="stylesheet" href="Modules/styles.css" />
  </head>

  <body>
    <!-- Header -->
    <header class="header">
      <div class="container">
        <h1 class="logo">Biblioteca Online</h1>
      </div>
    </header>

    <!-- Conteúdo -->
    <main class="main">
      <div class="container">

        <div class="content-login login-box">

          <h2 class="login-title">Login</h2>

          <p class="login-subtitle">
            Faça login para acessar sua biblioteca
          </p>

          <form id="loginForm" class="login-form">

            <input
              type="email"
              placeholder="seu@email.com"
              class="search-input"
              required
            />

            <input
              type="password"
              placeholder="••••••••"
              class="search-input"
              required
            />

            <div class="login-remember">
              <input type="checkbox" id="remember" />
              <label for="remember">Lembrar-me</label>
            </div>

            <button type="submit" class="btn-primary btn-full">
              Entrar
            </button>

          </form>  

          <p class="login-footer">
            Não tem conta?
            <a href="cadastro.html">Cadastre-se</a>
          </p>

        </div>

      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>© 2026 Todos os direitos reservados.</p>
      <p>Desenvolvido por Jaerverson & Wilany</p>
    </footer>

  </body>
</html>
